# The Mac App Store build of Quoth (ADR-006). Generate the Xcode project with
#   xcodegen
# and build with `scripts/appstore.sh`. The direct build stays a Swift
# package (Package.swift, scripts/build-app.sh); both compile the same
# Sources/QuothCore, this one with the APPSTORE flag (Support/Edition.swift).
name: Quoth
options:
  bundleIdPrefix: com.victorshammas
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: AppStore/Quoth.xcconfig
  Release: AppStore/Quoth.xcconfig
packages:
  # The same releases as Package.resolved, so both editions build the same
  # code. Argument Parser only comes in through WhisperKit; it is listed to
  # pin it.
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    exactVersion: 1.1.0
  swift-argument-parser:
    url: https://github.com/apple/swift-argument-parser.git
    exactVersion: 1.7.1
targets:
  Quoth:
    type: application
    platform: macOS
    sources:
      - path: Sources/QuothCore
        excludes:
          # Direct build only: Sparkle updates, the quoth command and its
          # setup and doctor tools.
          - App/Updater.swift
          - App/CommandLineLink.swift
          - App/Setup.swift
          - App/Doctor.swift
          - App/ModelCommands.swift
      - path: AppStore/main.swift
      - path: AppStore/Assets.xcassets
      - path: AppStore/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
    settings:
      base:
        INFOPLIST_FILE: AppStore/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppStore/Quoth.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_VERSION: "5.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APPSTORE
        # QuothCore uses `package` access; one module here, so one package.
        OTHER_SWIFT_FLAGS: $(inherited) -package-name quoth
        DEAD_CODE_STRIPPING: YES
schemes:
  Quoth:
    build:
      targets:
        Quoth: all
    run:
      config: Debug
    archive:
      config: Release
